<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fuckgram</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--g:#F2F3F5;--k:#111;--m:#8E9297;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:#fff;color:var(--k);font:400 17px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(255,255,255,.9);backdrop-filter:blur(14px);z-index:30}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-weight:800;letter-spacing:-.04em;margin:0;line-height:1.02}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px)}
.hb{display:flex;align-items:center;gap:20px;height:60px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.045em;margin-right:auto}
.nl{font-size:14px;font-weight:500;color:#555}.nl:hover{color:var(--k)}
@media(max-width:760px){.nl{display:none}.hb{gap:10px}}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;padding:15px 26px;font:600 16px Inter,sans-serif;background:var(--g);color:var(--k);border:0;cursor:pointer;transition:background .25s,transform .2s ease-out;will-change:transform}
.pill.k{background:var(--k);color:#fff}.pill.k:hover{background:#333}.pill:not(.k):hover{background:#e6e7ea}
.pill.sm{padding:8px 16px;font-size:14px}
.roll{display:inline-block;height:1.4em;overflow:hidden;line-height:1.4em;vertical-align:bottom}
.roll i{display:block;font-style:normal;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.pill:hover .roll i{transform:translateY(-100%)}
.seg{position:relative;display:inline-flex;background:#fff;border-radius:9999px;padding:4px;box-shadow:0 0 0 1px #e4e5e8}
.seg button{position:relative;z-index:1;border:0;background:none;font:600 13px Inter,sans-serif;padding:5px 11px;border-radius:9999px;cursor:pointer;color:var(--k);transition:color .25s}
.seg button.on{color:#fff}
.ind{position:absolute;top:4px;bottom:4px;left:0;background:var(--k);border-radius:9999px;transition:transform .45s cubic-bezier(.3,1.25,.5,1),width .45s cubic-bezier(.3,1.25,.5,1)}
.hero{text-align:center;padding:72px 0 0}
.eye{font-size:14px;font-weight:600;color:var(--m);margin-bottom:18px}
h1{font-size:clamp(44px,9.5vw,108px)}
.bi span{display:inline-block;animation:bi .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes bi{from{opacity:0;filter:blur(14px);transform:translateY(14px)}to{opacity:1;filter:none;transform:none}}
.sub{color:var(--m);font-size:clamp(18px,2.4vw,24px);font-weight:500;margin:22px auto 32px;max-width:560px;letter-spacing:-.02em}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--m);margin-top:16px}
.phone-w{display:flex;justify-content:center;padding:64px 0 40px}
.phone{width:min(340px,74vw);aspect-ratio:9/19.5;background:var(--k);border-radius:56px;padding:10px;position:relative;box-shadow:0 0 0 2px #2a2a2a inset;will-change:transform}
.scr{width:100%;height:100%;border-radius:46px;overflow:hidden;background:#fff;position:relative}
.scr img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.isl{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:88px;height:26px;background:#000;border-radius:9999px;z-index:2}
section{padding:clamp(64px,11vw,130px) 0}
.c{text-align:center}
.big{font-size:clamp(34px,6.5vw,72px)}
.s2{color:var(--m);font-size:clamp(18px,2.4vw,24px);font-weight:500;letter-spacing:-.02em;margin-top:16px}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:56px;text-align:left}
@media(max-width:820px){.demo{grid-template-columns:1fr}}
.card{background:#fff;border-radius:36px;box-shadow:0 0 0 1px #e4e5e8;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(rgba(255,255,255,0),#fff);pointer-events:none}
.cl{position:relative;height:460px;overflow:hidden;padding:10px}
.row{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:24px;margin-bottom:4px;transition:background .5s}
.row:first-child{background:var(--g)}
.av{width:48px;height:48px;margin:3px;border-radius:50%;overflow:hidden;flex:none}
.av.rg{box-shadow:0 0 0 2.5px #fff,0 0 0 4px var(--k)}
.av svg{display:block}
.rt{min-width:0;flex:1}.rt b{display:block;font-size:16px;letter-spacing:-.01em}
.rt span{display:block;color:var(--m);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span.del{font-style:italic}
.lk{width:13px;height:13px;stroke:var(--m);fill:none;stroke-width:2;stroke-linecap:round;vertical-align:-1px;margin-right:4px}
.rm{text-align:right;flex:none}.rm time{display:block;color:var(--m);font-size:12px}
.bd{display:inline-block;min-width:24px;text-align:center;background:var(--k);color:#fff;border-radius:9999px;font-size:12px;font-weight:700;padding:2px 8px;margin-top:4px}
.bd.mu{background:#C9CBCF}
.ch{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #eef0f2}
.ch b{display:block;font-size:16px;line-height:1.2}.ch small{color:var(--m);font-size:13px}
.chip{margin-left:auto;font-size:12px;font-weight:600;background:var(--g);border-radius:9999px;padding:4px 10px;white-space:nowrap}
.cv{height:404px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px}
.bb{max-width:82%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.35;margin:3px 0}
.bb.in{align-self:flex-start;background:var(--g);border-bottom-left-radius:6px}
.bb.out{align-self:flex-end;background:var(--k);color:#fff;border-bottom-right-radius:6px}
.bb.dl{align-self:flex-start;background:#fff;border:1.5px dashed #C9CBCF;color:var(--m);border-bottom-left-radius:6px}
.bb small{display:block;font-size:11px;font-weight:600;margin-top:2px;opacity:.7}
.bb .lk{stroke:#fff}
.bb.en{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:56px;text-align:left}
@media(max-width:760px){.bento{grid-template-columns:1fr}.bc.w{grid-column:auto!important}}
.bc{position:relative;background:var(--g);border-radius:36px;padding:clamp(24px,4vw,40px);min-height:240px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.bc.w{grid-column:span 2}
.bc::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--x,50%) var(--y,50%),#fff,transparent 70%);opacity:0;transition:opacity .3s}
.bc:hover::before{opacity:.9}.bc>*{position:relative}
.bc.dk{background:var(--k);color:#fff}.bc.dk::before{display:none}
.bc h3{font-size:clamp(26px,3.4vw,38px)}
.bc p{margin:10px 0 0;color:#5d6066;font-size:17px;max-width:520px}.bc.dk p{color:#a9acb1}
.bc .n{position:absolute;top:28px;left:clamp(24px,4vw,40px);font-size:13px;font-weight:700;color:var(--m)}
.tw{margin-top:56px;overflow-x:auto;text-align:left;border-radius:28px;box-shadow:0 0 0 1px #e4e5e8}
table{width:100%;min-width:560px;border-collapse:collapse}
th,td{padding:18px 20px;text-align:center;font-size:16px}
th:first-child,td:first-child{text-align:left;font-weight:600}
thead th{font-weight:700;font-size:15px;color:var(--m)}
thead th.me{background:var(--k);color:#fff;border-radius:20px 20px 0 0}
td.me{background:var(--k);color:#fff}tbody tr:last-child td.me{border-radius:0 0 20px 20px}
tbody tr+tr td:not(.me){border-top:1px solid #eef0f2}
tbody tr+tr td.me{border-top:1px solid #2a2a2a}
.y{font-weight:800}.n{color:#C9CBCF}
.fn{font-size:13px;color:var(--m);margin-top:16px;text-align:center}
.get{background:var(--k);color:#fff;border-radius:44px;padding:clamp(48px,9vw,110px) 20px;text-align:center}
.get .pill{background:#fff;color:var(--k)}.get .pill:hover{background:#e6e7ea}.get .pill.g{background:#262626;color:#fff}.get .pill.g:hover{background:#333}
.get .note{color:#8E9297}
footer{padding:20px 0 130px;text-align:center;color:var(--m);font-size:14px}
footer a{margin:0 10px}footer a:hover{color:var(--k)}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:25;display:flex;gap:2px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-radius:9999px;padding:6px;box-shadow:0 0 0 1px #e4e5e8,0 10px 30px rgba(0,0,0,.08);transition:transform .6s cubic-bezier(.3,1.2,.5,1);max-width:calc(100% - 24px)}
.dock.show{transform:translate(-50%,0)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;padding:7px 16px;border-radius:9999px;transition:background .2s}
.dock a:hover{background:var(--g)}
.dock svg{width:24px;height:24px;stroke:var(--k);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
